<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Library</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:"Segoe UI",sans-serif; background:var(--bg-primary); color:var(--text-primary); height:100vh; overflow:hidden; transition:background 0.3s, color 0.3s; }

/* CSS Variables for Themes */
:root {
    --bg-primary: #0d0d1a;
    --bg-secondary: #14142b;
    --bg-tertiary: #1b1b38;
    --bg-card: #262650;
    --accent: #5a5aff;
    --accent-hover: #7878ff;
    --border: #252550;
    --text-primary: #ffffff;
    --text-secondary: #aaa;
    --text-muted: #666;
}

[data-theme="blue"] {
    --bg-primary: #0a1929;
    --bg-secondary: #0d2137;
    --bg-tertiary: #1a2744;
    --bg-card: #1e3a5f;
    --accent: #3ea6ff;
    --accent-hover: #5eb8ff;
    --border: #1e3a5f;
}

[data-theme="red"] {
    --bg-primary: #1a0d0d;
    --bg-secondary: #2b1414;
    --bg-tertiary: #381b1b;
    --bg-card: #502626;
    --accent: #ff5a5a;
    --accent-hover: #ff7878;
    --border: #502626;
}

[data-theme="green"] {
    --bg-primary: #0d1a0d;
    --bg-secondary: #142b14;
    --bg-tertiary: #1b381b;
    --bg-card: #265026;
    --accent: #5aff5a;
    --accent-hover: #78ff78;
    --border: #265026;
}

[data-theme="ocean"] {
    --bg-primary: #0d1a1a;
    --bg-secondary: #142b2b;
    --bg-tertiary: #1b3838;
    --bg-card: #265050;
    --accent: #5affff;
    --accent-hover: #78ffff;
    --border: #265050;
}

[data-theme="sunset"] {
    --bg-primary: #1a100d;
    --bg-secondary: #2b1814;
    --bg-tertiary: #38221b;
    --bg-card: #503826;
    --accent: #ff8a5a;
    --accent-hover: #ffa078;
    --border: #503826;
}

/* Layout Structure */
.app-container { display:flex; height:100vh; }

/* Left Category Sidebar */
.category-sidebar { 
    width:180px; 
    background:var(--bg-secondary); 
    border-right:2px solid var(--border); 
    overflow-y:auto; 
    padding:15px 10px;
    flex-shrink:0;
    transition:transform 0.3s;
}
.category-sidebar.hidden { transform:translateX(-100%); position:absolute; }
.category-sidebar h3 { 
    font-size:14px; 
    margin:0 0 12px 0; 
    color:var(--accent); 
    text-transform:uppercase;
    letter-spacing:1px;
}
.category-item { 
    padding:8px 10px; 
    margin-bottom:4px; 
    background:var(--bg-tertiary); 
    border-radius:6px; 
    cursor:pointer; 
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:background 0.2s;
}
.category-item:hover { background:var(--bg-card); }
.category-item.active { background:var(--accent); color:white; }
.category-count { 
    background:var(--bg-card); 
    padding:2px 6px; 
    border-radius:10px; 
    font-size:11px;
    color:var(--text-secondary);
}
.category-item.active .category-count { background:var(--accent-hover); color:white; }

.alt-hint {
    margin-top:auto;
    padding:12px 8px;
    font-size:11px;
    color:white;
    text-align:center;
    line-height:1.4;
    background:var(--bg-tertiary);
    border-radius:6px;
}

/* Repo Switcher */
.repo-switcher {
    margin-top:16px;
    margin-bottom:12px;
}
.repo-switcher-label {
    font-size:11px;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:6px;
    padding:0 2px;
}
.repo-btn {
    padding:8px 10px;
    margin-bottom:4px;
    background:var(--bg-tertiary);
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    transition:background 0.2s, color 0.2s;
    text-align:center;
    border:2px solid transparent;
}
.repo-btn:hover { background:var(--bg-card); color:var(--text-primary); }
.repo-btn.active { background:var(--accent); color:white; border-color:var(--accent-hover); }

/* Main Content Area */
.main-content { 
    flex:1; 
    display:flex; 
    flex-direction:column; 
    overflow:hidden;
}

/* Top Navigation Bar */
.top-bar { 
    background:var(--bg-secondary); 
    padding:15px 20px; 
    border-bottom:2px solid var(--border);
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    transition:all 0.3s;
}
.top-bar.hidden {
    display:none;
}
.top-bar input[type="text"] { 
    flex:1; 
    min-width:200px;
    padding:10px 15px; 
    border-radius:8px; 
    border:none; 
    background:var(--bg-tertiary); 
    color:var(--text-primary); 
}
.top-bar button, .top-bar select { 
    background:var(--bg-card); 
    border:none; 
    padding:10px 16px; 
    border-radius:8px; 
    color:var(--text-primary); 
    cursor:pointer; 
    font-size:14px;
    transition:background 0.2s;
}
.top-bar button:hover, .top-bar select:hover { background:var(--accent); }
.top-bar button.active { background:var(--accent); }
.top-bar select { cursor:pointer; }

/* Content Area */
.content-area { 
    flex:1; 
    overflow-y:auto; 
    padding:20px;
    display:flex;
    transition:all 0.3s;
}

/* Homepage View */
.homepage-view { 
    flex:1;
    display:none;
}
.quick-actions { 
    display:flex; 
    gap:12px; 
    margin-bottom:20px;
    flex-wrap:wrap;
}
.quick-actions button { 
    background:var(--accent); 
    border:none; 
    padding:12px 20px; 
    border-radius:8px; 
    color:white; 
    cursor:pointer; 
    font-size:14px;
    transition:background 0.2s;
}
.quick-actions button:hover { background:var(--accent-hover); }

.recommended-section {
    margin-bottom:20px;
    padding:15px;
    background:var(--bg-secondary);
    border-radius:12px;
}
.recommended-section h3 {
    margin:0 0 12px 0;
    color:var(--accent);
    font-size:16px;
}
.recommended-games {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}
.recommended-game {
    background:var(--bg-tertiary);
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.2s;
    font-size:14px;
}
.recommended-game:hover {
    background:var(--accent);
    color:white;
}

.games-grid { 
    display:grid; 
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); 
    gap:20px;
}
.game-card { 
    background:var(--bg-tertiary); 
    border-radius:12px; 
    overflow:hidden; 
    cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s;
    position:relative;
}
.game-card:hover { 
    transform:translateY(-4px); 
    box-shadow:0 8px 20px rgba(90,90,255,0.3);
}
.game-card img { 
    width:100%; 
    height:140px; 
    object-fit:cover; 
    background:#090914;
}
.game-card-info { 
    padding:12px; 
    text-align:center;
}
.game-card-title { 
    font-size:14px; 
    margin-bottom:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.game-card .star { 
    position:absolute; 
    top:8px; 
    right:8px; 
    font-size:20px; 
    cursor:pointer;
    color:gold;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
    z-index:2;
    transition:transform 0.2s;
}
.game-card .star.off { color:#555; }
.game-card .star:hover { transform:scale(1.2); }

/* ========================================
   GAME VIEW — full screen layout
   ======================================== */
.game-view { 
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:50;
    background:var(--bg-primary);
}
.game-view.active { display:flex; }

/* Game Controls Bar */
.game-controls-bar {
    position:fixed;
    top:0; left:0; right:0;
    z-index:110;
    background:var(--bg-secondary);
    border-bottom:2px solid var(--border);
    padding:8px 16px;
    display:flex;
    gap:10px;
    align-items:center;
}
.game-controls-bar button {
    background:var(--accent);
    border:none;
    padding:8px 16px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:background 0.2s;
}
.game-controls-bar button:hover { background:var(--accent-hover); }

/* The iframe stretches to fill everything */
.game-iframe-container { 
    flex:1;
    position:relative;
    margin-top:46px;
}
.game-iframe-container iframe { 
    position:absolute;
    top:0; left:0;
    width:100%; 
    height:100%; 
    border:none;
    display:block;
}

/* ========================================
   BROWSER VIEW — fullscreen iframe
   ======================================== */
.browser-view {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:50;
    background:var(--bg-primary);
    flex-direction:column;
}
.browser-view.active { display:flex; }

.browser-header {
    background:var(--bg-secondary);
    padding:15px 20px;
    border-bottom:2px solid var(--border);
    display:flex;
    gap:12px;
    align-items:center;
}

.browser-iframe-container {
    flex:1;
    position:relative;
}

.browser-iframe-container iframe {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
}



/* Focus Overlay */
#focusOverlay {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
    cursor:pointer;
    backdrop-filter:blur(5px);
}
#focusOverlay.active { display:flex; }
#focusOverlay h2 {
    color:white; 
    font-size:28px; 
    pointer-events:none;
    user-select:none;
    text-shadow:0 2px 8px black;
}

/* Modals */
.modal-overlay { 
    position:fixed; 
    top:0; left:0; 
    width:100%; height:100%; 
    background:rgba(0,0,0,0.8); 
    z-index:1000; 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    opacity:0; 
    pointer-events:none; 
    transition:opacity 0.2s; 
    backdrop-filter:blur(5px);
}
.modal-overlay.open { opacity:1; pointer-events:auto; }
.modal-box { 
    background:var(--bg-tertiary); 
    width:450px; 
    max-width:90%;
    max-height:80vh;
    padding:25px; 
    border-radius:12px; 
    box-shadow:0 5px 20px rgba(0,0,0,0.5); 
    border:2px solid var(--accent);
    position:relative;
    overflow-y:auto;
}
.modal-box h2 { 
    margin:0 0 20px 0; 
    font-size:22px; 
    border-bottom:2px solid var(--border); 
    padding-bottom:12px;
    color:var(--accent);
}
.close-modal { 
    position:absolute; 
    top:15px; 
    right:20px; 
    cursor:pointer; 
    color:var(--text-secondary); 
    font-size:28px;
    transition:color 0.2s;
}
.close-modal:hover { color:var(--text-primary); }
.setting-item { 
    margin-bottom:18px;
}
.setting-item label { 
    display:block; 
    margin-bottom:6px; 
    font-size:14px; 
    color:var(--text-secondary);
}
.setting-item select { 
    width:100%; 
    padding:10px; 
    border-radius:6px; 
    border:none; 
    background:var(--bg-card); 
    color:var(--text-primary); 
    cursor:pointer;
}
.setting-item input[type="file"] { 
    display:none;
}
.setting-item button { 
    width:100%; 
    padding:10px; 
    border-radius:6px; 
    border:none; 
    background:var(--accent); 
    color:white; 
    cursor:pointer;
    transition:background 0.2s;
}
.setting-item button:hover { background:var(--accent-hover); }

/* Toggle switch */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 24px;
}
.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #555;
    transition: 0.3s;
    border-radius: 24px;
}
.toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}
input:checked + .toggle-slider {
    background-color: var(--accent);
}
input:checked + .toggle-slider:before {
    transform: translateX(26px);
}
.toggle-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
}



/* Custom Alert */
#customAlert { 
    position:fixed; 
    top:50%; left:50%; 
    transform:translate(-50%,-50%); 
    background:var(--bg-tertiary); 
    border:2px solid var(--accent); 
    border-radius:12px; 
    padding:25px; 
    z-index:9999; 
    color:var(--text-primary); 
    display:none; 
    min-width:280px; 
    text-align:center; 
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#customAlert button { 
    margin-top:15px; 
    padding:8px 20px; 
    border:none; 
    border-radius:6px; 
    background:var(--accent); 
    color:white; 
    cursor:pointer;
    transition:background 0.2s;
}
#customAlert button:hover { background:var(--accent-hover); }

/* Custom Dialog */
#customDialog {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.8);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
    backdrop-filter:blur(5px);
}
#customDialog.show {
    opacity:1;
    pointer-events:auto;
}
.custom-dialog-box {
    background:var(--bg-tertiary);
    padding:25px;
    border-radius:12px;
    border:2px solid var(--accent);
    width:400px;
    max-width:90%;
}
#customDialogMessage {
    font-size:16px;
    margin-bottom:15px;
    color:var(--text-primary);
}
#customDialogInput {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    background:var(--bg-card);
    color:var(--text-primary);
    margin-bottom:15px;
}
#customDialogTextarea {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    background:var(--bg-card);
    color:var(--text-primary);
    margin-bottom:15px;
    min-height:100px;
    font-family:monospace;
    font-size:12px;
    resize:vertical;
}
.custom-dialog-buttons {
    display:flex;
    gap:10px;
}
.custom-dialog-buttons button {
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    transition:background 0.2s;
}
#customDialogCancel {
    background:#555;
    color:white;
}
#customDialogCancel:hover { background:#777; }
#customDialogOk, #customDialogCopy {
    background:var(--accent);
    color:white;
}
#customDialogOk:hover, #customDialogCopy:hover { background:var(--accent-hover); }


/* Sidebar Clock */
.sidebar-clock {
    margin-top:12px;
    margin-bottom:12px;
    padding:10px;
    background:var(--bg-tertiary);
    border-radius:8px;
    text-align:center;
}
.clock-time {
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.5px;
    font-family:monospace;
}
.clock-period {
    margin-top:4px;
    font-size:12px;
    font-weight:600;
    color:var(--text-primary);
    min-height:16px;
}

/* Scrollbar Styling */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg-secondary); }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent-hover); }

/* No games message */
.no-games { 
    text-align:center; 
    padding:60px 20px; 
    color:var(--text-muted);
    font-size:18px;
}

/* Loading indicator */
.loading {
    text-align:center;
    padding:40px;
    color:var(--text-secondary);
}

/* Search autocomplete */
.search-wrapper { flex:1; min-width:200px; position:relative; }
.search-wrapper input { width:100%; padding:10px 15px; border-radius:8px; border:none; background:var(--bg-tertiary); color:var(--text-primary); outline:none; }
.autocomplete-list { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; z-index:500; overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.4); max-height:220px; overflow-y:auto; }
.autocomplete-list.open { display:block; }
.autocomplete-item { padding:9px 14px; font-size:13px; cursor:pointer; color:var(--text-primary); display:flex; align-items:center; gap:8px; }
.autocomplete-item:hover, .autocomplete-item.selected { background:var(--accent); color:white; }
.autocomplete-item .ac-icon { font-size:11px; color:var(--text-muted); flex-shrink:0; }
.autocomplete-item:hover .ac-icon, .autocomplete-item.selected .ac-icon { color:rgba(255,255,255,0.7); }

/* Countdown */
.countdown-display { margin-top:8px; padding:8px 10px; background:var(--bg-tertiary); border-radius:6px; text-align:center; }
.countdown-label { color:var(--text-secondary); font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
.countdown-value { font-size:15px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
.countdown-value.urgent { color:#ff5a5a; animation:urgentPulse 1s ease-in-out infinite; }
@keyframes urgentPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }


</style>
</head>
<body>

<div class="app-container">
    <!-- Left Category Sidebar -->
    <div class="category-sidebar" id="categorySidebar">
        <h3>Categories</h3>
        <div id="categoryList">Loading...</div>

        <div class="repo-switcher">
            <div class="repo-switcher-label">Game Repo</div>
            <div class="repo-btn active" id="repoGnMath" data-repo="gnmath">GN-MATH</div>
            <div class="repo-btn" id="repoUntitled" data-repo="untitled">Untitled Stash</div>
            <div class="repo-btn" id="repoCustom" data-repo="custom">Custom</div>
        </div>

        <div class="sidebar-clock">
            <div class="clock-time" id="clockTime">00:00:00.000</div>
            <div class="clock-period" id="clockPeriod"></div>
        </div>

        <div class="countdown-display" id="countdownDisplay">
            <div class="countdown-label" id="countdownLabel">Next Period</div>
            <div class="countdown-value" id="countdownValue">--:--</div>
        </div>
        <div class="alt-hint">Press ALT+1 (at the same time) for instant switching!</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navigation Bar (hidden when playing) -->
        <div class="top-bar" id="topBar">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search games..." autocomplete="off">
                <div class="autocomplete-list" id="autocompleteList"></div>
            </div>
            <select id="sortSelect">
                <option value="name">Sort: A-Z</option>
                <option value="name-desc">Sort: Z-A</option>
                <option value="recent">Recently Played</option>
            </select>
            <button id="browserBtn">🌐 Browser</button>
            <button id="exportBtn">📤 Export</button>
            <button id="importBtn">📥 Import</button>
            <button id="settingsBtn">⚙ Settings</button>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Homepage View -->
            <div class="homepage-view" id="homepageView">
                <div class="quick-actions">
                    <button id="continueBtn">▶ Continue Last Game</button>
                    <button id="randomBtn">🎲 Random Game</button>
                    <button id="recentBtn">🕒 Recently Played</button>
                </div>
                
                <div class="recommended-section">
                    <h3>Recommended For You</h3>
                    <div class="recommended-games" id="recommendedGames">
                        Play more games to find out!
                    </div>
                </div>
                
                <div class="games-grid" id="gamesGrid">
                    <div class="loading">Loading games...</div>
                </div>
            </div>

            <!-- Game Playing View (goes fullscreen via fixed positioning) -->
            <div class="game-view" id="gameView">
                <div class="game-controls-bar" id="gameControlsBar">
                    <button id="backBtn">← Back</button>
                    <button id="reloadBtn">↻ Reload</button>
                    <button id="fullscreenBtn" title="Fullscreen">⛶ Fullscreen</button>
                </div>
                <div class="game-iframe-container" id="zoneViewer" style="display:none;">
                    <iframe id="zoneFrame" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" tabindex="0" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms" allow="fullscreen; autoplay; clipboard-write"></iframe>
                    <div id="focusOverlay">
                        <h2>Click to Resume</h2>
                    </div>
                </div>
            </div>

            <!-- Browser View -->
            <div class="browser-view" id="browserView">
                <div class="browser-header">
                    <button id="browserBackBtn" style="background:var(--accent); border:none; padding:10px 16px; border-radius:8px; color:white; cursor:pointer; font-size:14px;">← Back</button>
                </div>
                <div class="browser-iframe-container" id="browserIframeContainer"></div>
            </div>
        </div>
    </div>
</div>

<!-- Settings Modal -->

<script>
// Must be inside an iframe AND that iframe must be on the same origin.
// If opened directly as a top-level tab — close it.
// If embedded on a foreign origin — blank and close.
(function() {
    // Case 1: opened as a top-level tab
    if (window.self === window.top) {
        document.documentElement.innerHTML = "";
        window.close();
        return;
    }
    // Case 2: embedded on a different origin
    // Accessing window.top.location.href throws a SecurityError if cross-origin,
    // which is exactly what we want to detect.
    try {
        const parentOrigin = window.top.location.origin;
        if (parentOrigin !== window.location.origin) {
            document.documentElement.innerHTML = "";
            window.close();
        }
    } catch (e) {
        // SecurityError = cross-origin parent = not allowed
        document.documentElement.innerHTML = "";
        window.close();
    }
})();
</script>

// ===========================
// IndexedDB Setup
// ===========================
let db;
const DB_NAME = "GameLibraryDB";
const DB_VERSION = 1;
const STORE_NAME = "gameData";

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, { keyPath: "key" });
            }
        };
    });
}

async function saveToIndexedDB(key, value) {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put({ key, value });
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

async function getFromIndexedDB(key) {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result?.value);
        request.onerror = () => reject(request.error);
    });
}

// ===========================
// Dual Storage System
// ===========================
async function saveData(key, value) {
    const jsonValue = JSON.stringify(value);
    try { localStorage.setItem(key, jsonValue); } catch (e) { console.error("localStorage save failed:", e); }
    try { await saveToIndexedDB(key, value); } catch (e) { console.error("IndexedDB save failed:", e); }
}

async function loadData(key, defaultValue = null) {
    try {
        const lsData = localStorage.getItem(key);
        if (lsData) return JSON.parse(lsData);
    } catch (e) { console.error("localStorage load failed:", e); }
    try {
        const idbData = await getFromIndexedDB(key);
        if (idbData !== undefined) {
            localStorage.setItem(key, JSON.stringify(idbData));
            return idbData;
        }
    } catch (e) { console.error("IndexedDB load failed:", e); }
    return defaultValue;
}

function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function formatTimeShort(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m`;
    return `${seconds}s`;
}

function categorizeGame(name) {
    const lowerName = name.toLowerCase();
    for (const [category, keywords] of Object.entries(categoryKeywords)) {
        if (keywords.some(keyword => lowerName.includes(keyword))) return category;
    }
    return "Other";
}

function updateStreak() {
    const today = new Date().toDateString();
    if (!appData.visitDates.includes(today)) {
        appData.visitDates.push(today);
        saveAppData();
    }
}

function calculateStreak() {
    if (appData.visitDates.length === 0) return 0;
    const dates = appData.visitDates.map(d => new Date(d)).sort((a, b) => b - a);
    let streak = 1;
    for (let i = 0; i < dates.length - 1; i++) {
        const diff = Math.floor((dates[i] - dates[i + 1]) / (1000 * 60 * 60 * 24));
        if (diff === 1) streak++;
        else break;
    }
    return streak;
}

    const choice = appData.settings.thumbnail;
    if (choice === "upload" && appData.settings.uploadedImage) return appData.settings.uploadedImage;
    if (choice === "custom" && appData.settings.customURL) return appData.settings.customURL;
    return placeholderImages[choice] || placeholderImages.kai;

// Cache of all games from all repos (for cross-repo search)
let allGamesCache = {};

// ===========================
// Fetch Games from JSON
// ===========================
async function fetchGames() {
    document.getElementById("gamesGrid").innerHTML = '<div class="loading">Loading games...</div>';
    allGames = [];
    currentFilter = null;

    try {
        if (currentRepo === "gnmath") {
            const res  = await fetch(ZONES_JSON);
            const data = await res.json();
            allGames = data
                .filter(game => game.id >= 0)
                .map(game => ({
                    id: game.id.toString(),
                    name: game.name,
                    url: game.url,
                    category: categorizeGame(game.name),
                    repo: "gnmath"
                }));
        } else if (currentRepo === "untitled") {
            const res  = await fetch(REPOS.untitled.gamesJsonUrl);
            const data = await res.json();
            const entries = Array.isArray(data) ? data : Object.entries(data).map(([id, name]) => ({ id, name }));
            allGames = entries.map(entry => ({
                id: entry.id.toString(),
                name: entry.name,
                url: null,
                category: categorizeGame(entry.name),
                repo: "untitled"
            }));
        } else if (currentRepo === "custom") {
            const res  = await fetch(CUSTOM_ZONES_JSON);
            const data = await res.json();
            const entries = Array.isArray(data)
                ? data
                : Object.entries(data).map(([id, name]) => ({ id, name }));
            allGames = entries
                .filter(entry => entry.id !== undefined && entry.name)
                .map(entry => ({
                    id: (entry.id !== undefined ? entry.id : entry.name).toString(),
                    name: entry.name,
                    url: entry.url || null,
                    category: categorizeGame(entry.name),
                    repo: "custom"
                }));
        }

        // Cache this repo's games
        allGamesCache[currentRepo] = allGames;

        // Preload other repos in background for cross-repo search
        preloadOtherRepos();

        renderCategories();
        renderRecommendations();
        renderGames();
    } catch (err) {
        console.error("Failed to fetch games:", err);
        document.getElementById("gamesGrid").innerHTML = '<div class="no-games">Failed to load games. Check your connection and refresh.</div>';
    }
}

async function preloadOtherRepos() {
    const repoList = ["gnmath", "untitled", "custom"];
    for (const repo of repoList) {
        if (repo === currentRepo || allGamesCache[repo]) continue;
        try {
            if (repo === "gnmath") {
                const res = await fetch(ZONES_JSON);
                const data = await res.json();
                allGamesCache[repo] = data
                    .filter(g => g.id >= 0)
                    .map(g => ({ id: g.id.toString(), name: g.name, url: g.url, category: categorizeGame(g.name), repo: "gnmath" }));
            } else if (repo === "untitled") {
                const res = await fetch(REPOS.untitled.gamesJsonUrl);
                const data = await res.json();
                const entries = Array.isArray(data) ? data : Object.entries(data).map(([id, name]) => ({ id, name }));
                allGamesCache[repo] = entries.map(e => ({ id: e.id.toString(), name: e.name, url: null, category: categorizeGame(e.name), repo: "untitled" }));
            } else if (repo === "custom") {
                const res = await fetch(CUSTOM_ZONES_JSON);
                const data = await res.json();
                const entries = Array.isArray(data) ? data : Object.entries(data).map(([id, name]) => ({ id, name }));
                allGamesCache[repo] = entries
                    .filter(e => e.id !== undefined && e.name)
                    .map(e => ({ id: (e.id !== undefined ? e.id : e.name).toString(), name: e.name, url: e.url || null, category: categorizeGame(e.name), repo: "custom" }));
            }
        } catch(e) { /* silent — cross-repo search just won't include this repo */ }
    }
}

// Recommendations
// ===========================
function renderRecommendations() {
    const container = document.getElementById("recommendedGames");
    if (appData.recentGames.length === 0) { container.innerHTML = "Play more games to find out!"; return; }

    const categoryCounts = {};
    appData.recentGames.forEach(id => {
        const game = allGames.find(g => g.id === parseInt(id));
        if (game) categoryCounts[game.category] = (categoryCounts[game.category] || 0) + 1;
    });

    const topCategory = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1])[0]?.[0];
    if (!topCategory) { container.innerHTML = "Play more games to find out!"; return; }

    const recommendations = allGames
        .filter(g => g.category === topCategory && !appData.recentGames.includes(g.id.toString()))
        .slice(0, 5);

    if (recommendations.length === 0) { container.innerHTML = "You've played all games in your favourite category!"; return; }

    container.innerHTML = recommendations.map(game =>
        `<div class="recommended-game" data-id="${game.id}">${game.name}</div>`
    ).join('');

    container.querySelectorAll(".recommended-game").forEach(item => {
        item.onclick = () => loadGame(item.dataset.id);
    });
}

// ===========================
// Render Games Grid
// ===========================
function renderGames() {
    const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();

    if (searchTerm && !appData.searchHistory.includes(searchTerm)) {
        appData.searchHistory.unshift(searchTerm);
        if (appData.searchHistory.length > 10) appData.searchHistory = appData.searchHistory.slice(0, 10);
        saveAppData();
    }

    // When there's a search term, search across ALL cached repos
    const isSearching = !!searchTerm;
    const gamePool = isSearching
        ? Object.values(allGamesCache).flat()
        : allGames;

    // Deduplicate by id+repo key when searching across repos
    const seen = new Set();
    const deduped = isSearching ? gamePool.filter(g => {
        const key = g.repo + ":" + g.id;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    }) : gamePool;

    let filtered = deduped.filter(game => {
        if (currentFilter === 'favorites' && !appData.favorites.includes(game.id.toString())) return false;
        if (currentFilter && currentFilter !== 'favorites' && game.category !== currentFilter) return false;
        if (searchTerm && !game.name.toLowerCase().includes(searchTerm)) return false;
        return true;
    });

    // Sort
    if (currentSort === "name")        filtered.sort((a, b) => a.name.localeCompare(b.name));
    else if (currentSort === "name-desc") filtered.sort((a, b) => b.name.localeCompare(a.name));
    else if (currentSort === "recent") {
        filtered.sort((a, b) => {
            const ai = appData.recentGames.indexOf(a.id.toString()), bi = appData.recentGames.indexOf(b.id.toString());
            if (ai === -1 && bi === -1) return 0;
            if (ai === -1) return 1;
            if (bi === -1) return -1;
            return ai - bi;
        });
    }
    else if (currentSort === "mostplayed") filtered.sort((a, b) => (appData.playCount[b.id]||0) - (appData.playCount[a.id]||0));
    else if (currentSort === "longest")    filtered.sort((a, b) => (appData.longestSessions[b.id]||0) - (appData.longestSessions[a.id]||0));
    else if (currentSort === "totaltime")  filtered.sort((a, b) => (appData.gameTimes[b.id]||0) - (appData.gameTimes[a.id]||0));

    if (filtered.length === 0) {
        document.getElementById("gamesGrid").innerHTML = '<div class="no-games">No games found</div>';
        return;
    }

    document.getElementById("gamesGrid").innerHTML = filtered.map(game => {
        const isFav = appData.favorites.includes(game.id.toString());
        // Untitled Stash and Custom have no cover art — always use fallback
        const thumbnailURL = (game.repo === "untitled" || game.repo === "custom") ? getFallbackThumbnailURL() : getThumbnailURL(game.id);
        const repoTag = isSearching ? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">(${REPOS[game.repo]?.name || game.repo})</div>` : "";
        return `
            <div class="game-card" data-id="${game.id}" data-repo="${game.repo}">
                <span class="star ${isFav ? '' : 'off'}" data-id="${game.id}">★</span>
                <img src="${thumbnailURL}" alt="${game.name}" loading="lazy" onerror="this.src='${getFallbackThumbnailURL()}'">
                <div class="game-card-info">
                    <div class="game-card-title">${game.name}</div>
                    ${repoTag}
                </div>
            </div>`;
    }).join('');

    document.querySelectorAll(".game-card").forEach(card => {
        card.onclick = (e) => {
            if (e.target.classList.contains("star")) return;
            const cardRepo = card.dataset.repo;
            const cardId = card.dataset.id;
            // If this game is from a different repo, switch first
            if (cardRepo && cardRepo !== currentRepo) {
                currentRepo = cardRepo;
                document.querySelectorAll(".repo-btn").forEach(b => b.classList.toggle("active", b.dataset.repo === currentRepo));
                fetchGames().then(() => loadGame(cardId));
            } else {
                loadGame(cardId);
            }
        };
    });

    document.querySelectorAll(".star").forEach(star => {
        star.onclick = (e) => {
            e.stopPropagation();
            const id = star.dataset.id;
            if (appData.favorites.includes(id)) {
                appData.favorites = appData.favorites.filter(f => f !== id);
                star.classList.add("off");
            } else {
                appData.favorites.push(id);
                star.classList.remove("off");
            }
            saveAppData();
            renderCategories();
        };
    });
}

// ===========================
// Autocomplete / Search History
// ===========================
const searchInput = document.getElementById("searchInput");
const autocompleteList = document.getElementById("autocompleteList");
let acIndex = -1;

function buildAutocomplete(val) {
    const q = val.trim().toLowerCase();
    autocompleteList.innerHTML = "";
    acIndex = -1;
    if (!q) { autocompleteList.classList.remove("open"); return; }

    // History matches first, then game name matches from ALL repos
    const histMatches = appData.searchHistory.filter(h => h.includes(q)).slice(0, 3);

    // Gather all games from all cached repos
    const allCachedGames = Object.values(allGamesCache).flat();
    const gameMatches = allCachedGames.filter(g => g.name.toLowerCase().includes(q)).slice(0, 6);

    const items = [];
    histMatches.forEach(h => items.push({ label: h, icon: "🕒", type: "history" }));
    gameMatches.forEach(g => {
        if (!histMatches.includes(g.name.toLowerCase())) {
            const repoName = REPOS[g.repo]?.name || g.repo;
            items.push({ label: g.name, icon: "🎮", type: "game", id: g.id, repo: g.repo, repoName });
        }
    });

    if (items.length === 0) { autocompleteList.classList.remove("open"); return; }

    items.forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "autocomplete-item";
        const repoLabel = item.type === "game" && item.repoName ? ` <span style="font-size:10px;opacity:0.6">(${item.repoName})</span>` : "";
        el.innerHTML = `<span class="ac-icon">${item.icon}</span><span>${item.label}${repoLabel}</span>`;
        el.onmousedown = (e) => {
            e.preventDefault();
            if (item.type === "game" && item.repo && item.repo !== currentRepo) {
                // Switch to repo then load game
                searchInput.value = "";
                autocompleteList.classList.remove("open");
                currentRepo = item.repo;
                document.querySelectorAll(".repo-btn").forEach(b => b.classList.toggle("active", b.dataset.repo === currentRepo));
                fetchGames().then(() => {
                    loadGame(item.id);
                });
            } else {
                searchInput.value = item.label;
                autocompleteList.classList.remove("open");
                renderGames();
            }
        };
        autocompleteList.appendChild(el);
    });
    autocompleteList.classList.add("open");
}

searchInput.oninput = () => { renderGames(); buildAutocomplete(searchInput.value); };
searchInput.onkeydown = (e) => {
    const items = autocompleteList.querySelectorAll(".autocomplete-item");
    if (!autocompleteList.classList.contains("open") || items.length === 0) return;
    if (e.key === "ArrowDown") { e.preventDefault(); acIndex = Math.min(acIndex + 1, items.length - 1); items.forEach((el,i) => el.classList.toggle("selected", i === acIndex)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); acIndex = Math.max(acIndex - 1, -1); items.forEach((el,i) => el.classList.toggle("selected", i === acIndex)); }
    else if (e.key === "Enter" && acIndex >= 0) { items[acIndex].dispatchEvent(new MouseEvent("mousedown")); }
    else if (e.key === "Escape") { autocompleteList.classList.remove("open"); }
};
searchInput.onblur = () => setTimeout(() => autocompleteList.classList.remove("open"), 150);

// ===========================
// Load Game
// ===========================

async function loadGame(gameId) {
    gameId = gameId.toString();
    currentGame = gameId;
    
    const game = allGames.find(g => g.id.toString() === gameId);
    if (!game) {
        showGameError("Game not found");
        return;
    }

    console.log("Loading game:", game.name, "ID:", gameId);

    // ── update tracking data ──
    appData.recentGames = appData.recentGames.filter(g => g !== gameId);
    appData.recentGames.unshift(gameId);
    if (appData.recentGames.length > 10) appData.recentGames = appData.recentGames.slice(0, 10);
    appData.playCount[gameId] = (appData.playCount[gameId] || 0) + 1;
    saveAppData();

    // ── UI: switch to game view, hide top bar ──
    document.getElementById("homepageView").style.display   = "none";
    document.getElementById("categorySidebar").classList.add("hidden");
    document.getElementById("topBar").classList.add("hidden");
    document.getElementById("gameView").classList.add("active");

    // ── Build game URL ──
    const gameURL = game.url && game.url.startsWith("http")
        ? game.url
        : game.repo === "untitled"
            ? REPOS.untitled.gameBaseUrl + game.id + ".html"
            : game.repo === "custom"
                ? (game.url ? game.url.replace("{BASE_URL}", CUSTOM_BASE) : CUSTOM_BASE + game.id + ".html")
                : game.url.replace("{HTML_URL}", HTML_URL);

    // ── Show game view immediately so user sees something happening ──
    zoneViewer.style.display = "block";
    zoneViewer.hidden = false;

    // ── Fetch HTML ──
    let html;
    try {
        const res = await fetch(gameURL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        html = await res.text();
    } catch (err) {
        console.error("Load error:", err);
        showGameError(err.message);
        return;
    }

    // ── Derive base URL ──
    const baseMatch = html.match(/<base\s[^>]*href=["']([^"']+)["']/i);
    const base = baseMatch
        ? baseMatch[1]
        : gameURL.substring(0, gameURL.lastIndexOf('/') + 1);

    // ── Sanitize ──

    // 1. Remove Google Analytics / gtag external script tag (any GA tracking ID)
    html = html.replace(/<script\b[^>]+src=["'][^"']*googletagmanager\.com[^"']*["'][^>]*>\s*<\/script>/gi, "");

    // 2. Remove the inline gtag config block (window.dataLayer + gtag function + gtag calls)
    html = html.replace(/<script\b[^>]*>[\s\S]*?window\.dataLayer[\s\S]*?<\/script>/gi, "");

    // 3. Remove any element with id="sidebar1" or id="sidebar2" (any tag)
    html = html.replace(/<[a-z][^>]*\bid=["']sidebar[12]["'][^>]*>[\s\S]*?<\/[a-z]+>/gi, "");
    // Also catch self-closing or short elements
    html = html.replace(/<[a-z][^>]*\bid=["']sidebar[12]["'][^>]*\/?>/gi, "");

    // 4. Remove ONLY the specific ad-injection obfuscated script.
    //    Fingerprinted by its unique string array containing known ad domains/identifiers.
    //    This avoids nuking Unity loader scripts which also contain _0x patterns.
    html = html.replace(/<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi, (match, body) => {
        // Must contain the specific obfuscated array fingerprint strings from the ad injector
        const isAdInjector = (
            body.includes('sidebarad1') ||
            body.includes('sidebarad2') ||
            body.includes('duplace.ne') ||
            body.includes('eadisgay.e') ||
            body.includes('sidebar-fr') ||
            body.includes('G-WX5VS54Z')
        );
        return isAdInjector ? '' : match;
    });

    // ── Fix relative URLs so assets load from CDN ──

    // Rewrite src/href attributes (skip absolute URLs, data:, blob:, javascript:, #)
    const parts = html.split(/(<script[\s\S]*?<\/script>)/gi);
    html = parts.map(part => {
        if (/^<script\b(?![^>]*\bsrc\s*=)/i.test(part)) return part; // skip inline scripts
        return part.replace(
            /\b(href|src)=(["'])(?!https?:|\/\/|data:|blob:|javascript:|#)([^"']*)\2/gi,
            (_, attr, q, rel) => `${attr}=${q}${base}${rel}${q}`
        );
    }).join('');

    // Rewrite Unity build path variables
    html = html.replace(
        /((?:buildUrl|loaderUrl|streamingAssetsUrl|dataUrl|frameworkUrl|codeUrl|unityBuildUrl)\s*=\s*)(["'])(?!https?:|\/\/|data:|blob:)([^"']+)\2/g,
        (_, pre, q, val) => `${pre}${q}${base}${val}${q}`
    );

    // Fix Unity hostname check
    html = html.replace(/new URL\(url, location\.origin\)\.hostname/g, '""');

    // Ensure <base href> as fallback
    if (!/<base\b[^>]*href/i.test(html)) {
        html = html.replace(/(<head[^>]*>)/i, `$1<base href="${base}">`);
    }

    // ── Write into iframe ──
    // Always replace the iframe element fresh to avoid any stale state
    const container = zoneFrame.parentNode;
    const newFrame = document.createElement("iframe");
    newFrame.id = "zoneFrame";
    newFrame.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;border:none;";
    newFrame.tabIndex = 0;
    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms");
    newFrame.setAttribute("allow", "fullscreen; autoplay; clipboard-write");
    container.replaceChild(newFrame, zoneFrame);
    zoneFrame = newFrame;

    // Write HTML directly — no src round-trip so no lag
    zoneFrame.contentDocument.open();
    zoneFrame.contentDocument.write(html);
    zoneFrame.contentDocument.close();

    // Focus and setup overlay after doc is ready
    requestAnimationFrame(() => {
        try { zoneFrame.contentWindow.focus(); } catch(e) {}
        setupFocusDetection(zoneFrame);
    });
}

// ===========================
// Focus Detection & Pause
// ===========================
function setupFocusDetection(iframe) {
    const overlay = document.getElementById("focusOverlay");

    const showOverlay = () => { overlay.classList.add("active"); isActive = false; };
    const hideOverlay = () => {
        overlay.classList.remove("active");
        try { iframe.contentWindow.focus(); } catch(e) {}
        iframe.focus();
        isActive = true;
    };

    try {
        if (iframe.contentWindow) {
            iframe.contentWindow.addEventListener("blur", () => {
                setTimeout(() => { if (document.activeElement !== iframe) showOverlay(); }, 100);
            });
            iframe.contentWindow.addEventListener("focus", () => {
                overlay.classList.remove("active");
                isActive = true;
            });
        }
    } catch(e) { /* cross-origin — overlay will still work on click */ }

    overlay.onclick = (e) => { e.stopPropagation(); hideOverlay(); };
}

    { name: "Lunch",     start: "11:19", end: "11:44" },
    { name: "Period 6",  start: "11:47", end: "12:33" },
    { name: "Period 7",  start: "12:36", end: "1:22"  },
    { name: "Period 8",  start: "1:25",  end: "2:11"  },
];

function parseTime(str) {
    const [h, m] = str.split(":").map(Number);
    return h * 60 + m;
}

function getCurrentPeriod() {
    const now = new Date();
    const total = now.getHours() * 60 + now.getMinutes();
    for (const p of PERIODS) {
        if (total >= parseTime(p.start) && total <= parseTime(p.end)) return p.name;
    }
    return null;
}

function tickClock() {
    const now = new Date();
    const precision = appData.settings.clockPrecision || "ms";
    const clockEl = document.getElementById("clockTime");
    const sidebarClock = document.querySelector(".sidebar-clock");

    if (precision === "off") {
        if (sidebarClock) sidebarClock.style.display = "none";
    } else {
        if (sidebarClock) sidebarClock.style.display = "";
        let h = now.getHours();
        const m  = String(now.getMinutes()).padStart(2, "0");
        const s  = String(now.getSeconds()).padStart(2, "0");
        const ms = String(now.getMilliseconds()).padStart(3, "0");
        let timeStr;
        if (appData.settings.use24Hour) {
            const hh = String(h).padStart(2, "0");
            timeStr = precision === "ms" ? `${hh}:${m}:${s}.${ms}` : `${hh}:${m}:${s}`;
        } else {
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            timeStr = precision === "ms" ? `${h}:${m}:${s}.${ms} ${ampm}` : `${h}:${m}:${s} ${ampm}`;
        }
        clockEl.textContent = timeStr;
    }

    const period = getCurrentPeriod();
    document.getElementById("clockPeriod").textContent = period || "";
    tickCountdown(now);
}

function tickCountdown(now) {
    const totalNow = now.getHours() * 60 + now.getMinutes();
    const secNow   = totalNow * 60 + now.getSeconds();
    const labelEl  = document.getElementById("countdownLabel");
    const valueEl  = document.getElementById("countdownValue");

    // Find current period end or next period start
    let label = "", secs = null, urgent = false;

    for (const p of PERIODS) {
        const start = parseTime(p.start) * 60;
        const end   = parseTime(p.end) * 60 + 59;
        if (secNow >= start && secNow <= end) {
            // Inside a period — count down to end
            secs  = end - secNow;
            label = p.name + " ends";
            urgent = secs <= 120;
            break;
        }
    }

    if (secs === null) {
        // Between periods — find next one
        for (const p of PERIODS) {
            const start = parseTime(p.start) * 60;
            if (start > secNow) {
                secs  = start - secNow;
                label = p.name + " starts";
                break;
            }
        }
    }

    if (secs === null || secs < 0) {
        labelEl.textContent = "After School";
        valueEl.textContent  = "--";
        valueEl.classList.remove("urgent");
        return;
    }

    const mm = String(Math.floor(secs / 60)).padStart(2, "0");
    const ss = String(secs % 60).padStart(2, "0");
    labelEl.textContent  = label;
    valueEl.textContent  = `${mm}:${ss}`;
    valueEl.classList.toggle("urgent", urgent);
}

setInterval(tickClock, 10);
tickClock();

async function initApp() {
    await initDB();
    await loadAppData();
    applyTheme(appData.settings.theme);
    document.getElementById("themeSelect").value = appData.settings.theme;
    document.getElementById("bgSelect").value    = appData.settings.thumbnail;
    document.getElementById("overrideThumbnails").checked = appData.settings.overrideThumbnails;
    document.getElementById("developerMode").checked = appData.settings.developerMode;
    document.getElementById("use24Hour").checked = appData.settings.use24Hour || false;
    document.getElementById("clockPrecision").value = appData.settings.clockPrecision || "ms";
    updateNetworkStatus();
    document.getElementById("homepageView").style.display = "block";
    await fetchGames();
}

initApp();
